; RoboDog P1 — ESP32 motor control + web pad
; Board: generic ESP32 dev module (Lonely Binary ESP32-U, external antenna)
; If uploads fail: hold the BOOT button while it says "Connecting...", or lower upload_speed to 115200.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Serial monitor filters so you can read logs cleanly
monitor_filters = esp32_exception_decoder, time
